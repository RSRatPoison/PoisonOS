name: Daily build

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check commit identity
        env:
          GIT_NAME: ${{ vars.GIT_NAME }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL }}
        run: |
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "::error::Set repository variables GIT_NAME and GIT_EMAIL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Implement next roadmap task
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL: ${{ vars.MODEL }}
          FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL }}
          MAX_CONTEXT_CHARS: ${{ vars.MAX_CONTEXT_CHARS }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_EMAIL }}
        run: python3 scripts/daily_task.py

      - name: Push to main
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
