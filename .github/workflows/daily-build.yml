name: Daily build

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only one role"
        type: choice
        default: all
        options:
          - all
          - builder
          - tester
          - reviewer
          - planner

permissions:
  contents: write

concurrency:
  group: daily-build
  cancel-in-progress: false

jobs:
  work:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: planner
            role: planner
            provider: groq
          - name: builder-1
            role: builder
            provider: groq
          - name: builder-2
            role: builder
            provider: groq
          - name: builder-3
            role: builder
            provider: openrouter
          - name: tester
            role: tester
            provider: groq
          - name: reviewer
            role: reviewer
            provider: groq
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Check commit identity
        env:
          GIT_NAME: ${{ vars.GIT_NAME }}
          GIT_EMAIL: ${{ vars.GIT_EMAIL }}
        run: |
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "::error::Set repository variables GIT_NAME and GIT_EMAIL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Run ${{ matrix.role }}
        env:
          ROLE: ${{ matrix.role }}
          ONLY_ROLE: ${{ inputs.only }}
          PROVIDER: ${{ matrix.provider }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          MODEL: ${{ vars.MODEL }}
          FALLBACK_MODEL: ${{ vars.FALLBACK_MODEL }}
          MAX_CONTEXT_CHARS: ${{ vars.MAX_CONTEXT_CHARS }}
          GIT_AUTHOR_NAME: ${{ vars.GIT_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_EMAIL }}
          GIT_COMMITTER_NAME: ${{ vars.GIT_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_EMAIL }}
        run: python3 scripts/daily_task.py

      - name: Push to main
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
